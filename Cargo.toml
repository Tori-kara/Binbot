[package]
name = "binbot"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
config = "0.15.25"
dotenvy = "0.15.7"
futures-util = "0.3.34"
poise = "0.7.0"
redis = { version = "1.7.0", features = ["tokio-comp", "tokio-native-tls-comp"] }
rust_decimal = "1.43.0"
rust_decimal_macros = "1.40.0"
rustls = "0.23.44"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sqlx = { version = "0.9.0", features = ["runtime-tokio", "tls-rustls", "postgres", "macros", "migrate", "rust_decimal"] }
tokio = { version = "1.53.1", features = ["full"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }
tower-http = { version = "0.7.1", features = ["cors", "trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
url = "2.5.8"
