services:
  # ----------------------------------------------------------------------------
  # Binbot Web Service
  # ----------------------------------------------------------------------------
  - type: web
    name: binbot
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: PORT
        value: 10000
      - key: RUST_LOG
        value: info
      # Sensitive Discord token to be configured in Render Dashboard
      - key: DISCORD_TOKEN
        sync: false
      # Optional Discord Guild ID for instant slash command registration during testing
      - key: DISCORD_GUILD_ID
        sync: false
      # Redis connection URL (e.g. Upstash Redis, Render Key-Value, or custom)
      - key: REDIS_URL
        sync: false
      # Connect automatically to the provisioned PostgreSQL database below
      - key: DATABASE_URL
        fromDatabase:
          name: binbot-postgres
          property: connectionString
      # Binance WebSocket endpoints (sensible defaults provided)
      - key: BINANCE_WEBSOCKET_RAW_ENDPOINT
        value: wss://stream.binance.com:9443/ws
      - key: BINANCE_WEBSOCKET_STREAM_ENDPOINT
        value: wss://stream.binance.com:9443/stream

# ------------------------------------------------------------------------------
# Managed PostgreSQL Database (Free tier available on Render)
# ------------------------------------------------------------------------------
databases:
  - name: binbot-postgres
    plan: free
    databaseName: binbot
    user: binbot_user
